<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#303030] text-white font-sans relative">

<!-- 🔹 Background Grid Lines -->
<div class="fixed inset-0 pointer-events-none z-0 hidden lg:flex">
  <div class="absolute left-[1.6%] top-0 bottom-0 border-r border-white/40"></div>
  <div class="flex w-full">
    <div class="flex-1 border-r border-white/20"></div>
    <div class="flex-1 border-r border-white/20"></div>
    <div class="flex-1 border-r border-white/20"></div>
    <div class="flex-1"></div>
  </div>
</div>

<!-- Navbar -->
<div id="navbar" class="w-full flex justify-between items-center p-4 z-50 transition-all duration-300 fixed top-0 left-0 bg-transparent">

  <!-- Left: Logo -->
  <a href="index.html" style="text-decoration: none;">
    <div class="flex items-center relative z-10 logo-wrap">
      <img class="rotating-logo" style="width: 40px;" src="logo.png" alt="Logo">
      <span class="logo">MASBOT</span>
    </div>
  </a>

  <style>
    .logo {
      font-size: 25px; 
      margin-left: 20px;
      font-weight: 700;
      color: white;
      text-transform: uppercase;
      transform: scaleX(1.0);
    }
  </style>

  <!-- Right: Navigation (Desktop) -->
  <div class="hidden md:flex gap-6 items-center pr-6 relative z-10">
    <a href="#" class="nav-link">About</a>
    <a href="#" class="nav-link">Services</a>
    <a href="#" class="nav-link">Core Values</a>
    <a href="Contect Us.html" class="nav-link">Contact</a>
  </div>

  <!-- Hamburger (Mobile) -->
  <div class="md:hidden flex items-center z-10">
    <button id="menu-btn" class="relative w-8 h-8 flex flex-col justify-between p-1">
      <span class="bar w-6 h-0.5 bg-white"></span>
      <span class="bar w-6 h-0.5 bg-white"></span>
      <span class="bar w-6 h-0.5 bg-white"></span>
    </button>
  </div>
</div>

<!-- Mobile Menu -->
<div id="mobile-menu" class="hidden fixed top-16 right-4 w-48 bg-white rounded-md flex flex-col items-start py-3 space-y-2 z-50 md:hidden shadow-lg">
  <a href="#" class="mobile-link text-[#f37021] px-4 py-2 w-full">About</a>
  <a href="#" class="mobile-link text-[#f37021] px-4 py-2 w-full">Services</a>
  <a href="#" class="mobile-link text-[#f37021] px-4 py-2 w-full">Core Values</a>
  <a href="Contect Us.html" class="mobile-link text-[#f37021] px-4 py-2 w-full">Contact</a>
</div>

<style>
  /* ✅ Navbar line below */
  #navbar::after {
    content: "";
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 1px;
    background-color: rgba(255, 255, 255, 0.2);
  }

  /* Rotating Logo */
  @keyframes rotate {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  .rotating-logo {
    animation: rotate 10s linear infinite;
  }

  /* Nav links */
  .nav-link {
    position: relative;
    color: white;
    font-weight: 500;
    text-decoration: none;
    transition: color 0.3s ease;
  }
  .nav-link:hover { color: rgba(255, 255, 255, 0.8); }
  .nav-link::after {
    content: "";
    position: absolute;
    left: 0;
    bottom: -4px;
    width: 0%;
    height: 2px;
    background-color: #f37021; /* orange underline */
    transition: width 0.3s ease;
  }
  .nav-link:hover::after { width: 100%; }

  /* Mobile nav */
  .mobile-link { font-weight: 500; transition: color 0.3s ease; }
  .mobile-link:hover { color: #f37021; }

  /* Hamburger bars */
  #menu-btn .bar { background: white; height: 3px; }

  @media (max-width: 768px) {
    .logo-wrap { margin-left: 0px; }
    #menu-btn { margin-right: 10px; }
  }
</style>

<script>
  // Scroll hide/show navbar (desktop only)
  let lastScrollTop = 0;
  const navbar = document.getElementById("navbar");

  window.addEventListener("scroll", function () {
    if (window.innerWidth <= 768) return;
    let scrollTop = window.pageYOffset || document.documentElement.scrollTop;
    navbar.style.backgroundColor = "transparent";
    if (scrollTop > lastScrollTop) {
      navbar.style.transform = "translateY(-100%)";
    } else {
      navbar.style.transform = "translateY(0)";
    }
    lastScrollTop = scrollTop <= 0 ? 0 : scrollTop;
  });

  // Mobile menu toggle
  const menuBtn = document.getElementById("menu-btn");
  const mobileMenu = document.getElementById("mobile-menu");
  menuBtn.addEventListener("click", () => {
    mobileMenu.classList.toggle("hidden");
    menuBtn.classList.toggle("open");
  });
</script>

<!-- 📞 Contact Page -->
<section class="min-h-screen relative px-4 sm:px-8 py-16 mt-16 z-10">
  <div class="w-full h-full grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-10 relative">

    <!-- Section 1 -->
    <div class="flex flex-col justify-center items-center text-center px-4">
      <h2 class="text-2xl sm:text-3xl font-bold mb-4">Get in Touch</h2>
      <p class="mb-2">Email: <span class="text-[#f37021]">info@masbot.com</span></p>
      <p class="mb-2">Phone: <span class="text-[#f37021]">+92 300 1234567</span></p>
      <p>Address: 123 Tech Street, Lahore, Pakistan</p>
    </div>

    <!-- Section 2 -->
    <div class="flex flex-col justify-center items-center px-4 space-y-6">
      <h2 class="text-xl sm:text-2xl font-semibold mb-4">Follow Us</h2>
      <div class="flex space-x-6">
        <a href="#" class="text-[#f37021] hover:text-white transform hover:scale-125 transition"><i class="fab fa-facebook-f fa-2x"></i></a>
        <a href="#" class="text-[#f37021] hover:text-white transform hover:scale-125 transition"><i class="fab fa-twitter fa-2x"></i></a>
        <a href="#" class="text-[#f37021] hover:text-white transform hover:scale-125 transition"><i class="fab fa-linkedin-in fa-2x"></i></a>
        <a href="#" class="text-[#f37021] hover:text-white transform hover:scale-125 transition"><i class="fab fa-instagram fa-2x"></i></a>
      </div>
    </div>

    <!-- Section 3 -->
    <div class="flex flex-col justify-center items-center px-4">
      <h2 class="text-xl sm:text-2xl font-semibold mb-4">Send a Message</h2>
      <form class="space-y-4 w-full max-w-sm">
        <input type="text" placeholder="Your Name" class="w-full px-4 py-2 rounded-lg bg-[#404040] border border-white/20 focus:outline-none focus:border-[#f37021]">
        <input type="email" placeholder="Your Email" class="w-full px-4 py-2 rounded-lg bg-[#404040] border border-white/20 focus:outline-none focus:border-[#f37021]">
        <textarea placeholder="Your Message" rows="5" class="w-full px-4 py-2 rounded-lg bg-[#404040] border border-white/20 focus:outline-none focus:border-[#f37021]"></textarea>
        <button type="submit" class="bg-[#f37021] hover:bg-[#ff802a] text-black font-semibold px-6 py-2 rounded-lg transition-all w-full">Send</button>
      </form>
    </div>

    <!-- Section 4 -->
    <div class="flex flex-col justify-center items-center px-4">
      <h2 class="text-xl sm:text-2xl font-semibold mb-4">Visit Us</h2>
      <p class="mb-4 text-center">We’re located in the heart of Lahore, ready to serve you.</p>
      <div class="w-full h-48 sm:h-64 bg-[#404040] rounded-xl flex items-center justify-center text-white/50">
        Map Placeholder
      </div>
    </div>

  </div>
</section>

</body>
</html>
